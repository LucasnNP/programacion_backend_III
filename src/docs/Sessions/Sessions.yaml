paths:
  /api/sessions/register:
    post:
      summary: Registrar un nuevo usuario
      description: Registra un nuevo usuario, encripta la contraseña antes de almacenarla y devuelve el identificador generado.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/RegisterUser"
      responses:
        "201":
          description: Usuario registrado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Datos inválidos, incompletos o el usuario ya existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: User already exists
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Internal server error
  /api/sessions/login:
    post:
      summary: Iniciar sesion de usuario
      description: Autentica un usuario mediante email y contraseña. Si las credenciales son válidas, devuelve una cookie JWT para acceder a los endpoints protegidos.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/LoginUser"
      responses:
        "200":
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Invalid credentials
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Internal server error
  /api/sessions/current:
    get:
      summary: Obtener usuario autenticado
      description: Devuelve la información del usuario autenticado a partir del JWT almacenado en la cookie.
      tags:
        - Sessions
      responses:
        "200":
          description: Usuario autenticado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: Token inexistente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Unauthorized
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Internal server error
  /api/sessions/unprotectedLogin:
    post:
      summary: Iniciar sesión sin DTO
      description: Autentica un usuario utilizando email y contraseña y genera un JWT con el objeto completo del usuario, sin utilizar el UserDTO. Se puede comparar la diferencia entre utilizar DTOs y exponer directamente el modelo de datos.
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/LoginUser"
      responses:
        "200":
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Invalid credentials
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Internal server error
  /api/sessions/unprotectedCurrent:
    get:
      summary: Obtener usuario autenticado sin DTO
      description: Devuelve la información del usuario autenticado a partir del JWT almacenado en la cookie, sin utilizar el UserDTO. Se puede comparar la diferencia entre utilizar DTOs y exponer directamente el modelo de datos.
      tags:
        - Sessions
      responses:
        "200":
          description: Usuario autenticado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprotectedCurrentResponse"
        "401":
          description: Token inexistente, inválido o expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Unauthorized
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: Internal server error

components:
  requestBodies:
    RegisterUser:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          description: Nombre del usuario.
        last_name:
          type: string
          description: Apellido del usuario.
        email:
          type: string
          format: email
          description: Correo electrónico del usuario.
        password:
          type: string
          format: password
          description: Contraseña del usuario.
      example:
        first_name: Juan
        last_name: Pérez
        email: juan.perez@mail.com
        password: coder123
    LoginUser:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario.
        password:
          type: string
          format: password
          description: Contraseña del usuario.
      example:
        email: juan.perez@mail.com
        password: coder123

  schemas:
    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          type: string
          description: Id del usuario creado.
      example:
        status: success
        payload: 686fba68d90f563ee24780e1
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Logged in
    CurrentUserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: "#/components/schemas/UserDTO"
    UnprotectedCurrentResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          $ref: "#/components/schemas/SessionUser"
    UserDTO:
      type: object
      description: Información del usuario autenticado contenida en el JWT.
      properties:
        name:
          type: string
          description: Nombre completo del usuario.
          example: Juan Pérez
        role:
          type: string
          description: Rol asignado al usuario.
          example: user
        email:
          type: string
          description: Correo electrónico del usuario.
          example: juan.perez@mail.com
    SessionUser:
      type: object
      description: Modelo completo del usuario almacenado en la base de datos.
      properties:
        _id:
          type: string
          description: identificador único del usuario.
          example: 686fba68d90f563ee24780e1
        first_name:
          type: string
          description: Nombre del usuario.
          example: Juan
        last_name:
          type: string
          description: Apellido del usuario.
          example: Pérez
        email:
          type: string
          format: email
          description: Correo electrónico del usuario.
          example: juan.perez@mail.com
        password:
          type: string
          format: password
          description: Contraseña del usuario (encriptada).
          example: $2b$10$0K8J4S2...
        role:
          type: string
          description: Rol asignado al usuario.
          example: user
        pets:
          type: array
          description: Mascotas asociadas al usuario.
          items:
            type: string
            description: Id de la mascota asociada al usuario.
            example: 686fba68d90f563ee24780e1
        __v:
          type: integer
          description: Versión del documento en MongoDB.
          example: 0
        iat:
          type: integer
          description: Fecha de emisión del token JWT (Unix Timestamp).
          example: 1697059200
        exp:
          type: integer
          description: Fecha de expiración del token JWT (Unix Timestamp).
          example: 1697062800
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: Estado de la respuesta.
          example: error
        error:
          type: string
          description: Mensaje descriptivo del error.
